<!-- Vue de pairing : saisie de la clé API du capteur Whisperer -->
<div class="homey-form-group">
  <label class="homey-form-label" for="apikey">Clé API du capteur / Sensor API key</label>
  <input id="apikey" class="homey-form-input" type="text"
         placeholder="clé du capteur (32 caractères)" autocomplete="off" />
  <p class="homey-text-small" style="margin-top:8px;color:#888">
    Compte Netro &rarr; Account &rarr; API Key &rarr; sélectionnez votre capteur &rarr; Generate API Key.
  </p>
  <p id="error" style="color:#c0392b;display:none;margin-top:8px"></p>
  <p id="ok" style="color:#27ae60;display:none;margin-top:8px"></p>
</div>

<button id="next" class="homey-button-primary-full" disabled>Vérifier / Verify</button>

<script type="application/javascript">
  const input = document.getElementById('apikey');
  const btn = document.getElementById('next');
  const errEl = document.getElementById('error');
  const okEl = document.getElementById('ok');

  input.addEventListener('input', () => {
    btn.disabled = input.value.trim().length < 10;
    errEl.style.display = 'none';
    okEl.style.display = 'none';
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    errEl.style.display = 'none';
    try {
      const info = await Homey.emit('validate_key', input.value);
      okEl.textContent = 'Capteur trouvé (' + info.readings + ' relevés récents).';
      okEl.style.display = 'block';
      Homey.showView('list_devices');
    } catch (e) {
      errEl.textContent = 'Clé invalide ou capteur injoignable.';
      errEl.style.display = 'block';
      btn.disabled = false;
    }
  });

  Homey.setTitle('Connexion au capteur Netro');
</script>
