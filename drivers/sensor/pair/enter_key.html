<!-- Pairing view: Netro sensor API key entry (localised EN/FR) -->
<div class="homey-form-group">
  <label class="homey-form-label" for="apikey" id="lbl"></label>
  <input id="apikey" class="homey-form-input" type="text" autocomplete="off" />
  <p class="homey-text-small" id="hint" style="margin-top:8px;color:#888"></p>
  <p id="error" style="color:#c0392b;display:none;margin-top:8px"></p>
  <p id="ok" style="color:#27ae60;display:none;margin-top:8px"></p>
</div>

<button id="next" class="homey-button-primary-full" disabled></button>

<script type="application/javascript">
  const input = document.getElementById('apikey');
  const btn = document.getElementById('next');
  const errEl = document.getElementById('error');
  const okEl = document.getElementById('ok');

  document.getElementById('lbl').textContent = Homey.__('pair.sensorApiKey');
  input.placeholder = Homey.__('pair.sensorPlaceholder');
  document.getElementById('hint').textContent = Homey.__('pair.sensorHint');
  btn.textContent = Homey.__('pair.verify');
  Homey.setTitle(Homey.__('pair.sensorTitle'));

  input.addEventListener('input', () => {
    btn.disabled = input.value.trim().length < 10;
    errEl.style.display = 'none';
    okEl.style.display = 'none';
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    errEl.style.display = 'none';
    try {
      const info = await Homey.emit('validate_key', input.value);
      okEl.textContent = Homey.__('pair.foundSensor') + info.name;
      okEl.style.display = 'block';
      Homey.showView('list_devices');
    } catch (e) {
      errEl.textContent = Homey.__('pair.sensorInvalid');
      errEl.style.display = 'block';
      btn.disabled = false;
    }
  });
</script>
